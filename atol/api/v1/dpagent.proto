syntax = "proto3";

package atol.api.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "atol.sh/protos/gen/go/atol/api/v1;apiv1";

// DPAgentService is the data-plane API that embedded SDKs (and standalone
// data-plane agents) use to synchronize with the Atol control plane.
//
// Lifecycle:
//
// 1. On startup, an agent calls GetBootstrapSnapshot to load the full
//    authorization model, all tuples, the active policy bundle, and policy
//    data, receiving a continuation token.
// 2. It then opens StreamMutations with that token to receive live updates.
// 3. As it serves authorization decisions locally, it streams them back via
//    IngestDecisionLogs for the audit timeline.
//
// The remaining methods support device intelligence: GetSessionDeviceSnapshot
// lets the SDK compare live request signals against a session's bound device,
// and ReportDeviceDivergence reports mismatches.
service DPAgentService {
  // GetBootstrapSnapshot returns everything an agent needs to initialize: the
  // authorization model, all tuples, the active OPA policy bundle, policy data,
  // and a continuation token for incremental updates via StreamMutations.
  rpc GetBootstrapSnapshot(GetBootstrapSnapshotRequest) returns (GetBootstrapSnapshotResponse);

  // IngestDecisionLogs accepts a client stream of decision logs from the agent
  // and persists them for audit and analytics.
  rpc IngestDecisionLogs(stream IngestDecisionLogsRequest) returns (IngestDecisionLogsResponse);

  // StreamMutations opens a server stream that pushes real-time mutations
  // (tuple writes/deletes, model updates, policy updates) to connected SDK
  // instances after bootstrap, keeping their in-memory state current.
  rpc StreamMutations(StreamMutationsRequest) returns (stream StreamMutationsResponse);

  // GetSessionDeviceSnapshot returns the device bound to a session (keyed by
  // the token's `jti`) so the SDK can compare live, per-request, server-side
  // signals against it locally, without a round trip on every request.
  rpc GetSessionDeviceSnapshot(GetSessionDeviceSnapshotRequest) returns (GetSessionDeviceSnapshotResponse);

  // ReportDeviceDivergence accepts a low-volume client stream of divergence
  // events: a token presented with server-side signals (JA4 / user-agent / IP)
  // that differ from the session's bound device, or with no client fingerprint
  // at all. Each becomes a `session.device_mismatch` timeline event and, for an
  // unknown client, a server-signal device profile.
  rpc ReportDeviceDivergence(stream ReportDeviceDivergenceRequest) returns (ReportDeviceDivergenceResponse);

  // ListRevokedSessions returns the session revocation list (CRL) for an
  // organization. Embedded SDKs poll this to maintain the in-memory deny
  // list that rejects revoked-but-unexpired session tokens (the token's
  // `jti` claim is the session id).
  rpc ListRevokedSessions(ListRevokedSessionsRequest) returns (ListRevokedSessionsResponse);
}

// ListRevokedSessionsRequest fetches the session revocation list for an
// organization.
message ListRevokedSessionsRequest {
  // Organization to list revoked sessions for.
  string org_id = 1;
}

// ListRevokedSessionsResponse is the session revocation list.
message ListRevokedSessionsResponse {
  // Revoked session identifiers (JWT `jti` values).
  repeated string revoked_session_ids = 1;

  // Server time the list was generated at.
  google.protobuf.Timestamp as_of = 2;
}

// GetSessionDeviceSnapshotRequest looks up the device bound to a session.
message GetSessionDeviceSnapshotRequest {
  // Organization the session belongs to.
  string org_id = 1;

  // Session identifier (the token's `jti` claim).
  string session_id = 2;
}

// GetSessionDeviceSnapshotResponse is the bound-device snapshot the SDK caches
// per session and compares live request signals against.
message GetSessionDeviceSnapshotResponse {
  // Whether a device is bound to the session. When false, the remaining fields
  // are unset and the SDK has nothing to compare against.
  bool found = 1;

  // Bound device identifier.
  string device_id = 2;

  // Bound device's server TLS fingerprint. May be empty for client-only
  // devices that were never observed at the TLS layer.
  string ja4 = 3;

  // Bound device's user-agent family, e.g. `chrome`.
  string user_agent = 4;

  // Bound device platform, e.g. `macos`, `windows`.
  string platform = 5;

  // Bound device browser family, e.g. `chrome`.
  string browser_family = 6;
}

// ReportDeviceDivergenceRequest wraps a single divergence event for streaming.
message ReportDeviceDivergenceRequest {
  // The divergence event to report.
  DeviceDivergenceEvent event = 1;
}

// DeviceDivergenceEvent reports that a token was presented with server-side
// signals that diverge from the session's bound device.
message DeviceDivergenceEvent {
  // Organization the session belongs to.
  string org_id = 1;

  // Session identifier (the token's `jti` claim).
  string session_id = 2;

  // User the session belongs to.
  string user_id = 3;

  // Device the session was bound to at login.
  string bound_device_id = 4;

  // Live server TLS fingerprint observed on this request.
  string observed_ja4 = 5;

  // Live user-agent observed on this request.
  string observed_user_agent = 6;

  // Live client IP observed on this request.
  string observed_ip = 7;

  // What diverged: `ja4`, `user_agent`, `ip`, or `no_fingerprint`.
  string divergence_kind = 8;

  // When the divergence was observed.
  google.protobuf.Timestamp observed_at = 9;
}

// ReportDeviceDivergenceResponse summarizes the divergence ingestion outcome.
message ReportDeviceDivergenceResponse {
  // Number of divergence events accepted.
  int32 accepted = 1;

  // Number rejected, e.g. for validation failures.
  int32 rejected = 2;
}

// GetBootstrapSnapshotRequest fetches the full snapshot for an organization.
message GetBootstrapSnapshotRequest {
  // Organization to bootstrap for.
  string org_id = 1;
}

// GetBootstrapSnapshotResponse contains the full authorization and policy state
// an agent needs to begin serving decisions locally.
message GetBootstrapSnapshotResponse {
  // Authorization model in Atol's FGA DSL format.
  string authorization_model = 1;

  // All authorization tuples for the organization.
  repeated Tuple tuples = 2;

  // Active OPA policy bundle as a gzip-compressed tar archive.
  bytes policy_bundle = 3;

  // OPA data tree content (the `data` document the bundle evaluates against).
  google.protobuf.Struct policy_data = 4;

  // Token for requesting incremental updates via StreamMutations.
  string continuation_token = 5;

  // Version of the active policy bundle (monotonically increasing).
  int32 policy_bundle_version = 6;

  // Highest version among all policy data paths.
  int32 policy_data_version = 7;

  // Monotonic revision of the authorization model.
  int64 authorization_model_revision = 8;

  // Canonical tenant ID authorized by the server. The request org_id may be
  // either this ID or a slug; clients must key tenant-local caches by this ID.
  string tenant_id = 9;
}

// Tuple is an authorization relationship triple: `user` has `relation` on
// `object`.
message Tuple {
  // Subject in `type:id` form, e.g. `user:alice`.
  string user = 1;

  // Relation name, e.g. `editor`.
  string relation = 2;

  // Object in `type:id` form, e.g. `document:readme`.
  string object = 3;
}

// IngestDecisionLogsRequest wraps a single decision log entry for streaming.
message IngestDecisionLogsRequest {
  // The decision log entry to persist.
  DecisionLog log = 1;
}

// DecisionLog records a single authorization decision made by an agent.
message DecisionLog {
  // Organization this decision belongs to.
  string org_id = 1;

  // Unique request identifier for correlation across systems.
  string request_id = 2;

  // When the decision was made.
  google.protobuf.Timestamp timestamp = 3;

  // SPIFFE ID or identity of the actor making the request.
  string actor_identity = 4;

  // Authentication method used: `oidc`, `spiffe`, or `api_key`.
  string auth_method = 5;

  // Action being authorized, e.g. `read`, `write`, `delete`.
  string action = 6;

  // Resource being accessed in `type:id` form, e.g. `document:readme`.
  string resource = 7;

  // Whether the request was allowed.
  bool allowed = 8;

  // OPA rule or Zanzibar check that determined the decision.
  string matched_rule = 9;

  // Evaluation latency in microseconds.
  int32 eval_us = 10;

  // Number of Zanzibar checks performed during evaluation.
  int32 zanzibar_calls = 11;

  // Additional decision context, e.g. matched conditions.
  google.protobuf.Struct context = 12;
}

// IngestDecisionLogsResponse summarizes the ingestion outcome.
message IngestDecisionLogsResponse {
  // Number of decision logs accepted.
  int32 accepted = 1;

  // Number rejected, e.g. for validation failures.
  int32 rejected = 2;
}

// StreamMutationsRequest initiates a mutation stream for an organization.
message StreamMutationsRequest {
  // Organization to stream mutations for.
  string org_id = 1;

  // Continuation token from bootstrap or a previous stream. The server resumes
  // delivery from the position this token encodes.
  string continuation_token = 2;

  // Fresh 256-bit base64url challenge for authenticated serving-lease frames.
  // Empty preserves the legacy stream contract without granting a lease.
  string serving_challenge = 3;
}

// StreamMutationsResponse delivers a single mutation plus the updated
// continuation token to resume from.
message StreamMutationsResponse {
  // The mutation that occurred. Exactly one variant is set per message.
  oneof mutation {
    // A new authorization tuple was written.
    TupleWrite tuple_write = 1;

    // An authorization tuple was removed.
    TupleDelete tuple_delete = 2;

    // The authorization model changed.
    ModelUpdate model_update = 3;

    // A new policy bundle was activated.
    PolicyBundleUpdate policy_bundle_update = 4;

    // A policy data path changed.
    PolicyDataUpdate policy_data_update = 5;

    // The tenant's fail-closed serving state changed.
    TenantServingStateUpdate tenant_serving_state_update = 8;
  }

  // Updated continuation token to present on reconnect after this mutation.
  string continuation_token = 6;

  // Canonical tenant ID authorized by the server. The request org_id may be
  // either this ID or a slug; clients must key tenant-local caches by this ID.
  string tenant_id = 7;
}

// TupleWrite indicates a new authorization tuple was written.
message TupleWrite {
  // The tuple that was written.
  Tuple tuple = 1;
}

// TupleDelete indicates an authorization tuple was removed.
message TupleDelete {
  // The tuple that was removed.
  Tuple tuple = 1;
}

// ModelUpdate indicates the authorization model was updated.
message ModelUpdate {
  // The new authorization model in YAML format.
  string authorization_model = 1;

  // Monotonic revision of the authorization model.
  int64 revision = 2;
}

// PolicyBundleUpdate indicates a new policy bundle was activated.
message PolicyBundleUpdate {
  // The new policy bundle as a gzip-compressed tar archive.
  bytes policy_bundle = 1;

  // New bundle version (monotonically increasing).
  int32 version = 2;
}

// PolicyDataUpdate indicates policy data was changed at a specific path.
message PolicyDataUpdate {
  // The data path that changed, e.g. `atol/device_settings`.
  string path = 1;

  // The new data value at that path.
  google.protobuf.Struct data = 2;

  // New data version (monotonically increasing).
  int32 version = 3;
}

// TenantServingStateUpdate changes whether an already-running tenant replica
// may serve authorization decisions. Restricted is sticky until a separately
// authorized repair protocol publishes a newer active epoch.
message TenantServingStateUpdate {
  // Monotonic tenant serving-state epoch.
  int64 epoch = 1;

  // Authoritative state for the tenant.
  TenantServingState state = 2;

  // Erasure request that caused the restriction.
  string restriction_request_id = 3;

  // Bounded server-controlled restriction classification.
  string restriction_reason = 4;

  // Durable event that authorized this state transition.
  string authority_event_id = 5;

  // Append ordinal of the accepted erasure event that required restriction.
  int64 authority_append_ordinal = 6;

  // Server deadline for an active serving lease. Omitted for restrictions.
  google.protobuf.Timestamp lease_expires_at = 7;

  // Echo of the request's fresh serving challenge. Empty for restrictions.
  string serving_challenge = 8;
}

// TenantServingState is the fail-closed serving state of one tenant replica.
enum TenantServingState {
  // No authoritative serving state has been established.
  TENANT_SERVING_STATE_UNSPECIFIED = 0;

  // The tenant replica may serve while its authenticated lease is valid.
  TENANT_SERVING_STATE_ACTIVE = 1;

  // The tenant replica must deny authorization decisions.
  TENANT_SERVING_STATE_RESTRICTED = 2;
}
